<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Inventory Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="{{ url_for('home') }}">Inventory<span class="accent">Pro</span></a></div>
    <nav class="nav">
      <a href="{{ url_for('products') }}">Products</a>
      <a href="{{ url_for('locations') }}">Locations</a>
      <a href="{{ url_for('movements') }}">Movements</a>
      <a href="{{ url_for('report') }}">Report</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages">
          {% for category, msg in messages %}
            <div class="alert alert-{{ category }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    InventoryPro © 2025 — Built with ❤️
  </footer>
</body>
</html>
