{% extends 'base.html' %}
{% block content %}
<section class="card form-card">
  <h2>Add Product</h2>
  <form method="POST">
    <label>Product ID</label>
    <input name="product_id" required maxlength="50" placeholder="e.g. P001"/>
    <label>Name</label>
    <input name="name" required maxlength="200" placeholder="Product name"/>
    <button type="submit" class="btn btn-primary">Add Product</button>
  </form>
</section>
{% endblock %}
