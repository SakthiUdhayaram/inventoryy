{% extends 'base.html' %}
{% block content %}
<section class="card form-card">
  <h2>Add Movement</h2>
  <form method="POST">
    <label>Movement ID</label>
    <input name="movement_id" required maxlength="50" placeholder="e.g. M001"/>
    <label>Product</label>
    <select name="product_id" required>
      {% for product in products %}
      <option value="{{ product.product_id }}">{{ product.name }}</option>
      {% endfor %}
    </select>
    <label>Quantity</label>
    <input name="qty" required type="number" min="1" value="1"/>
    <label>From Location (optional)</label>
    <select name="from_location"><option value="">--None--</option>{% for location in locations %}<option value="{{ location.location_id }}">{{ location.name }}</option>{% endfor %}</select>
    <label>To Location (optional)</label>
    <select name="to_location"><option value="">--None--</option>{% for location in locations %}<option value="{{ location.location_id }}">{{ location.name }}</option>{% endfor %}</select>
    <button type="submit" class="btn btn-primary">Record Movement</button>
  </form>
</section>
{% endblock %}
