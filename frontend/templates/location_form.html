{% extends 'base.html' %}
{% block content %}
<section class="card form-card">
  <h2>Add Location</h2>
  <form method="POST">
    <label>Location ID</label>
    <input name="location_id" required maxlength="50" placeholder="e.g. L001"/>
    <label>Name</label>
    <input name="name" required maxlength="200" placeholder="Warehouse name"/>
    <button type="submit" class="btn btn-primary">Add Location</button>
  </form>
</section>
{% endblock %}
