{% extends 'base.html' %}
{% block content %}
<div class="list-header">
  <h2>Products</h2>
  <a class="btn btn-success" href="{{ url_for('add_product') }}">Add Product</a>
</div>
<div class="grid">
  {% for p in products %}
  <div class="card">
    <div class="card-title">{{ p.name }}</div>
    <div class="muted">ID: {{ p.product_id }}</div>
    <form method="POST" action="{{ url_for('delete_product', product_id=p.product_id) }}" onsubmit="return confirm('Delete product?');">
      <button class="btn btn-danger">Delete</button>
    </form>
  </div>
  {% else %}
  <div class="empty">No products found</div>
  {% endfor %}
</div>
{% endblock %}
